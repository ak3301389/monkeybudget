name: home_budget
description: Домашняя бухгалтерия

publish_to: 'none'

version: 4.8.0+128

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  fl_chart: ^0.68.0
  intl: ^0.20.3
  path_provider: ^2.1.3
  http: ^1.2.0
  flutter_local_notifications: ^17.0.0
  flutter_launcher_icons: ^0.13.1
  file_selector: ^1.0.3
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  mobile_scanner: ^7.0.0
  package_info_plus: ^8.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.0.0
  url_launcher: ^6.2.0
  dio: ^5.4.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - version_history.txt
    - assets/icons/banks/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/icon.png"
